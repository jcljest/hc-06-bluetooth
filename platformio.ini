; Arduino Mega 2560 firmware. src/main.cpp is an exact copy of the student
; sketch student/AIIT_Bluetooth/AIIT_Bluetooth.ino; both use the shared
; student/AIIT_Bluetooth/AIITBluetooth.h. Keep them identical (CLAUDE.md).
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -I student/AIIT_Bluetooth
